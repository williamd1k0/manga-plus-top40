name: Deploy to Pages

on:
  push:
    branches:
      - "main"
    paths:
      - "**.tsv"
      - "site/**"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'yarn'
      - run: yarn install
      - name: Install fd
        uses: baptiste0928/cargo-install@v3
        with:
          crate: fd-find
      - name: Install yj
        uses: baptiste0928/cargo-install@v3
        with:
          crate: yj
      - name: Install jinja2
        run: pip install jinja2-cli
      - name: Build Site
        run: make site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site/out'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
